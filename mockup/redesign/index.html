<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Агент деканата</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <span class="mark"><i data-icon="cap"></i></span>
      <div><b>Деканат</b><small>Агент для сотрудников</small></div>
    </div>

    <!-- ЧАТ -->
    <div class="chat-slot" id="chatSlot">
      <section class="chat" id="chat" aria-label="Чат с агентом">
        <div class="chat-head">
          <span class="orb"></span>
          <div class="who"><b>Агент деканата</b><small id="ctx"></small></div>
          <button type="button" class="btn ghost sm" id="clearBtn" aria-label="Новый диалог"><i data-icon="plus"></i><span>Новый диалог</span></button>
        </div>
        <div class="messages" id="messages" aria-live="polite"><div class="thread" id="thread"></div></div>
        <button type="button" class="peek" id="peek" hidden></button>
        <div class="composer">
          <div class="thumbs" id="attached" hidden></div>
          <form class="input-row" id="form">
            <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.jpg,.jpeg,.png" multiple hidden>
            <button type="button" class="icon-btn" id="attachBtn" title="Прикрепить файлы" aria-label="Прикрепить файлы"><i data-icon="clip"></i></button>
            <textarea id="input" rows="1" placeholder="Спросите агента или попросите изменить данные…" aria-label="Сообщение"></textarea>
            <kbd class="kbd" id="kbd">⌘K</kbd>
            <button type="submit" class="icon-btn send" id="sendBtn" title="Отправить" aria-label="Отправить" disabled><i data-icon="up"></i></button>
            <button type="button" class="icon-btn toggle" id="toggle" title="Развернуть чат" aria-label="Развернуть чат" aria-expanded="false"><i data-icon="down"></i></button>
          </form>
        </div>
      </section>
    </div>

    <div class="me">
      <div class="when"><b id="today"></b></div>
      <span class="avatar" id="meAvatar"></span>
    </div>
  </header>
  <div class="scrim" id="scrim"></div>

  <!-- СТРАНИЦА ВКЛАДКИ -->
  <main class="content" id="content"><div class="page" id="page"></div></main>

  <!-- ВКЛАДКИ -->
  <nav class="tabbar" aria-label="Разделы">
    <div class="tabs" role="tablist" id="tabs"><span class="tab-ind" aria-hidden="true"></span></div>
  </nav>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- ОКНО ПОДТВЕРЖДЕНИЯ -->
<div class="modal-scrim" id="confirm" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <span class="dialog-ico" id="confirmIco"><i data-icon="sparkle"></i></span>
    <div>
      <h3 id="confirmTitle">Применить изменения?</h3>
      <p>Вы уверены, что хотите применить данные изменения?</p>
    </div>
    <div id="confirmDiff"></div>
    <div class="actions">
      <button class="btn" id="cancelBtn">Отменить</button>
      <button class="btn primary" id="applyBtn">Применить изменения</button>
    </div>
  </div>
</div>

<!-- ПРОСМОТР ВЛОЖЕНИЯ -->
<div class="modal-scrim" id="viewer" hidden>
  <div class="viewer" role="dialog" aria-modal="true" aria-labelledby="viewerName">
    <div class="viewer-head">
      <span id="viewerName"></span>
      <button class="icon-btn" id="viewerClose" aria-label="Закрыть"><i data-icon="x"></i></button>
    </div>
    <div class="viewer-body" id="viewerBody"></div>
  </div>
</div>

<script src="icons.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = (ms) => new Promise((r) => setTimeout(r, REDUCED ? 0 : ms));
const EASE = "cubic-bezier(.22, 1, .36, 1)";

if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* ═════════ ДАННЫЕ ═════════
   Строки выдуманы, но структура — как в БД «Деканат» (deanery_db/): поля = колонки представлений
   из 02_views_functions.sql, справочники и допустимые значения — из 03_seed.sql. */

// Детерминированный генератор, чтобы данные не менялись при перезагрузке
let seed = 7;
const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
const pick = (a) => a[Math.floor(rnd() * a.length)];
const int = (a, b) => a + Math.floor(rnd() * (b - a + 1));

const iso = (d) => d.toISOString().slice(0, 10);
const D = (s) => new Date(s + "T00:00:00Z");
const addDays = (s, n) => { const d = D(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const mondayOf = (s) => addDays(s, -((D(s).getUTCDay() + 6) % 7));
const TODAY = "2026-10-02";
const TERM_FIRST = "2026-09-01", TERM_LAST = "2026-12-20";
const TERM_MONDAY = mondayOf(TERM_FIRST);
const weekNo = (s) => Math.round((D(mondayOf(s)) - D(TERM_MONDAY)) / 6048e5) + 1;

/* ── Справочники (03_seed.sql) ── */
// study_group → curriculum → study_program → specialty: эти пять групп учатся по программе 1
const PROGRAM = { spec: "09.03.04 Программная инженерия", profile: "Системный анализ и проектирование программных комплексов", form: "Очная" };
const GROUPS = [
  { name: "ИДБ-23-11", year: 2023, curator: null },
  { name: "ИДБ-23-12", year: 2023, curator: null },
  { name: "ИДБ-24-11", year: 2024, curator: null },
  { name: "ИДБ-24-12", year: 2024, curator: null },
  { name: "ИДБ-25-11", year: 2025, curator: "Соколов Алексей Михайлович" },
].map((g) => ({ ...PROGRAM, ...g }));
// curriculum_item учебного плана программы 1: [дисциплина, семестр, форма контроля]
const CURRICULUM = [
  ["Математический анализ", 1, "Экзамен"], ["Линейная алгебра и аналитическая геометрия", 1, "Экзамен"], ["Основы программирования", 1, "Экзамен"],
  ["Информатика", 1, "Зачёт"], ["Иностранный язык", 1, "Зачёт"], ["Введение в профессиональную деятельность", 1, "Зачёт"],
  ["Математический анализ", 2, "Экзамен"], ["Дискретная математика", 2, "Экзамен"], ["Объектно-ориентированное программирование", 2, "Экзамен"],
  ["Иностранный язык", 2, "Зачёт"], ["Математическая логика и теория алгоритмов", 2, "Зачёт"], ["Компьютерная графика", 2, "Дифференцированный зачёт"],
  ["Учебная практика", 2, "Дифференцированный зачёт"],
  ["Теория вероятностей и математическая статистика", 3, "Экзамен"], ["Алгоритмы и структуры данных", 3, "Экзамен"], ["Иностранный язык", 3, "Зачёт"],
  ["Архитектура вычислительных систем", 3, "Экзамен"], ["Теория графов", 3, "Зачёт"], ["Технологии программирования", 3, "Дифференцированный зачёт"],
  ["Базы данных", 4, "Экзамен"], ["Операционные системы", 4, "Экзамен"], ["Компьютерные сети", 4, "Зачёт"], ["Иностранный язык", 4, "Зачёт"],
  ["Системное программирование", 4, "Дифференцированный зачёт"],
  ["Веб-технологии", 5, "Дифференцированный зачёт"], ["Информационная безопасность", 5, "Зачёт"], ["Параллельное программирование", 5, "Экзамен"],
  ["Человеко-машинное взаимодействие", 5, "Зачёт"], ["Проектирование и архитектура программных систем", 5, "Экзамен"],
  ["Курсовая работа по проектированию программных систем", 5, "Курсовая работа"],
  ["Машинное обучение", 6, "Экзамен"], ["Проектирование информационных систем", 6, "Экзамен"], ["Облачные технологии", 6, "Зачёт"],
  ["Интернет вещей", 6, "Дифференцированный зачёт"], ["Производственная практика", 6, "Дифференцированный зачёт"], ["Тестирование программного обеспечения", 6, "Экзамен"],
  ["Системы искусственного интеллекта", 7, "Экзамен"], ["Управление программными проектами", 7, "Зачёт"], ["Распределённые системы обработки данных", 7, "Экзамен"],
  ["DevOps и непрерывная интеграция", 7, "Дифференцированный зачёт"], ["Методы и средства разработки программных комплексов", 7, "Экзамен"],
  ["Преддипломная практика", 8, "Дифференцированный зачёт"], ["Выполнение и защита ВКР", 8, "Защита ВКР"],
];
const course = (year) => 2026 - year + 1;           // fn_course: текущий семестр — 2026/27, осенний
const doneSemesters = (year) => (course(year) - 1) * 2;
const isGraded = (ct) => ct !== "Зачёт";            // control_type.is_graded
const mark = (p) => p >= 45 ? 5 : p >= 35 ? 4 : p >= 25 ? 3 : null;   // score_band

const M_LAST = ["Орлов", "Ганиев", "Ковалёв", "Смирнов", "Белов", "Лаптев", "Петров", "Зайцев", "Морозов", "Волков", "Соловьёв", "Козлов", "Фёдоров", "Карпов", "Тихонов"];
const M_FIRST = ["Денис", "Тимур", "Максим", "Артём", "Кирилл", "Сергей", "Илья", "Никита", "Егор", "Иван", "Роман", "Глеб"];
const F_FIRST = ["Алина", "Ксения", "Дарья", "Анна", "Мария", "Полина", "Вера", "Софья", "Елизавета", "Ольга"];
const PATR = ["Игоре", "Руслано", "Олего", "Андрее", "Сергее", "Викторо", "Дмитрие", "Алексее", "Павло"];
const fakeName = () => {
  const f = rnd() < 0.45;
  return `${pick(M_LAST)}${f ? "а" : ""} ${pick(f ? F_FIRST : M_FIRST)} ${pick(PATR)}${f ? "вна" : "вич"}`;
};

/* ── Сотрудники (v_employees): все 28 сотрудников из 03_seed.sql ── */
const POSITIONS = [null, ["Директор института", "administration"], ["Заместитель директора института", "administration"],
  ["Специалист по учебно-методической работе", "support"], ["Методист", "support"], ["Заведующий кафедрой", "teaching"],
  ["Профессор", "teaching"], ["Доцент", "teaching"], ["Старший преподаватель", "teaching"], ["Ассистент", "teaching"]];
const CATEGORY_NAME = { administration: "Администрация", support: "Учебно-вспомогательный персонал", teaching: "Преподаватели" };
// unit: у преподавателя — кафедра, у сотрудника деканата — деканат (в БД 'Деканат ' || институт), у директора — дирекция
const employees = [
  ["Смирнов Андрей Викторович", "smirnov.av", 1, 1, "2005-09-01", "Дирекция ИИТ"],
  ["Кузнецова Елена Павловна", "kuznetsova.ep", 2, 1, "2010-02-15", "Деканат"],
  ["Попова Ольга Игоревна", "popova.oi", 3, 1, "2015-08-20", "Деканат"],
  ["Васильева Марина Сергеевна", "vasilyeva.ms", 4, 1, "2021-09-01", "Деканат"],
  ["Козлов Дмитрий Александрович", "kozlov.da", 5, 1, "2001-09-01", "ИС"],
  ["Новиков Игорь Петрович", "novikov.ip", 7, 1, "2010-09-01", "ИС"],
  ["Морозова Анна Владимировна", "morozova.av", 8, 1, "2016-09-01", "ИС"],
  ["Волков Сергей Николаевич", "volkov.sn", 5, 1, "1998-09-01", "ПМ"],
  ["Лебедева Татьяна Юрьевна", "lebedeva.ty", 7, 1, "2012-09-01", "ПМ"],
  ["Соколов Алексей Михайлович", "sokolov.am", 9, 0.5, "2023-09-01", "ПМ"],
  ["Павлова Наталья Олеговна", "pavlova.no", 7, 0.75, "2008-09-01", "ИЯ"],
  ["Фёдоров Максим Андреевич", "fedorov.ma", 7, 1, "2014-09-01", "ИТиВС"],
  ["Орлова Ирина Валерьевна", "orlova.iv", 1, 1, "2009-03-01", "Дирекция ИСТМ"],
  ["Беляев Роман Олегович", "belyaev.ro", 7, 1, "2011-09-01", "ИС"],
  ["Громова Екатерина Сергеевна", "gromova.es", 8, 1, "2017-09-01", "ИС"],
  ["Ершов Павел Андреевич", "ershov.pa", 9, 1, "2022-09-01", "ИС"],
  ["Тарасова Ирина Николаевна", "tarasova.in", 6, 1, "1996-09-01", "ПМ"],
  ["Карпов Денис Игоревич", "karpov.di", 8, 1, "2015-09-01", "ПМ"],
  ["Широков Владимир Геннадьевич", "shirokov.vg", 6, 1, "1993-09-01", "ИТиВС"],
  ["Зайцева Ольга Михайловна", "zaytseva.om", 7, 1, "2009-09-01", "ИТиВС"],
  ["Кириллов Артём Сергеевич", "kirillov.as", 7, 1, "2014-09-01", "ИТиВС"],
  ["Панова Юлия Викторовна", "panova.yv", 8, 1, "2019-09-01", "ИТиВС"],
  ["Лазарев Никита Олегович", "lazarev.no", 9, 0.5, "2024-09-01", "ИТиВС"],
  ["Прохоров Евгений Борисович", "prokhorov.eb", 5, 1, "1991-09-01", "УиИТС"],
  ["Мельникова Анна Дмитриевна", "melnikova.ad", 7, 1, "2010-09-01", "УиИТС"],
  ["Руднев Илья Павлович", "rudnev.ip", 8, 1, "2020-09-01", "УиИТС"],
  ["Сорокина Елена Анатольевна", "sorokina.ea", 8, 1, "2013-09-01", "ИЯ"],
  ["Уткина Мария Сергеевна", "utkina.ms", 9, 1, "2021-09-01", "ИЯ"],
].map(([full_name, login, pos, rate, hire_date, unit], i) => ({
  employee_id: i + 1, personnel_number: "Т-" + String(i + 1).padStart(4, "0"), full_name,
  position: POSITIONS[pos][0], category: POSITIONS[pos][1], unit, employment_rate: rate, hire_date, dismissal_date: null,
  phone: `+7 900 111-01-${String(i + 1).padStart(2, "0")}`, email: `${login}@univ.ru`,
}));
const teachers = employees.filter((e) => e.category === "teaching");
const deanStaff = employees.filter((e) => e.unit === "Деканат");
const ME = deanStaff[0];

/* ── Студенты, результаты, долги (v_student_summary, v_last_result, v_debtors, v_expulsion_risk) ── */
const ACTIVE = "Обучается";                      // student_status.is_active
const students = [], results = [], debtors = [];
GROUPS.forEach((g, gi) => {
  for (let i = 1; i <= 8; i++) {
    const r = rnd();
    const status = r < 0.05 ? "Академический отпуск" : r < 0.09 ? "Отчислен" : ACTIVE;
    const st = {
      student_id: students.length + 1, student: fakeName(), record_book_number: `${String(g.year).slice(2)}-${gi + 1}1${String(i).padStart(2, "0")}`,
      group_name: g.name, course: course(g.year), status, funding: rnd() < 0.75 ? "Бюджет" : "Договор",
      // посещаемость отмечается только у обучающихся
      attendance_pct: status === ACTIVE ? +(70 + rnd() * 29).toFixed(1) : null,
      is_headman: false, is_foreign: rnd() < 0.05, needs_dormitory: rnd() < 0.3,
    };
    const weak = rnd() < 0.25;
    const pts = [];
    let n = 0;
    CURRICULUM.filter(([, s]) => s <= doneSemesters(g.year)).forEach(([discipline, semester, control_type]) => {
      const failed = rnd() < (weak ? 0.08 : 0.006);
      const points = failed ? null : Math.min(54, int(weak ? 25 : 32, 54));
      results.push({ ...st, discipline, semester, control_type, points });
      n++;
      if (failed) {
        debtors.push({ student_id: st.student_id, student: st.student, group_name: g.name, discipline, semester, control_type,
          attempts: int(1, 3), last_result: rnd() < 0.3 ? "Неявка" : isGraded(control_type) ? "Неудовлетворительно" : "Не зачтено" });
      }
      if (points != null) pts.push({ points, graded: isGraded(control_type) });
    });
    st.results = n;
    st.avg_points = pts.length ? +(pts.reduce((s, p) => s + p.points, 0) / pts.length).toFixed(1) : null;
    const marks = pts.filter((p) => p.graded).map((p) => mark(p.points));
    st.min_mark = marks.length ? Math.min(...marks) : null;
    students.push(st);
  }
});
// Староста — study_group.headman_id; в v_student_summary это is_headman
GROUPS.forEach((g) => { const h = students.find((s) => s.group_name === g.name && s.status === ACTIVE); if (h) h.is_headman = true; });
const studentById = (id) => students.find((s) => s.student_id === id);
const isActive = (id) => studentById(id)?.status === ACTIVE;
// v_debtors и v_expulsion_risk показывают только обучающихся
const debtorsNow = () => debtors.filter((d) => isActive(d.student_id));
const expulsion = [];
// Категория и стипендия пересчитываются и после правок через чат
function categorize(s) {
  s.debts = s.status === ACTIVE ? debtors.filter((d) => d.student_id === s.student_id).length : 0;
  s.category = s.status !== ACTIVE ? s.status
    : expulsion.some((e) => e.student_id === s.student_id) ? "Кандидат на отчисление"
    : s.debts > 0 ? "Есть задолженности"
    : !s.results ? "Ещё не сдавал сессию"
    : s.min_mark === 5 ? "Отличник" : s.min_mark === 4 ? "Хорошист" : s.min_mark === 3 ? "Есть тройки" : "Только зачёты";
  s.scholarships = s.funding === "Бюджет" && ["Отличник", "Хорошист"].includes(s.category)
    ? (s.category === "Отличник" ? "Повышенная государственная академическая" : "Государственная академическая") : null;
}
students.forEach((s) => {
  const ds = debtors.filter((d) => d.student_id === s.student_id).sort((a, b) => a.discipline.localeCompare(b.discipline, "ru"));
  const max = Math.max(...ds.map((d) => d.attempts));
  if (ds.length && (ds.length >= 3 || max >= 3)) {
    expulsion.push({ student_id: s.student_id, student: s.student, group_name: s.group_name, debts: ds.length, max_attempts: max,
      disciplines: ds.map((d) => `${d.discipline} (${d.attempts} ${d.attempts === 1 ? "попытка" : "попытки"})`).join(", "),
      reason: max >= 3 ? "Не сдана комиссия" : "Три и более задолженности" });
  }
  categorize(s);
});
const expulsionNow = () => expulsion.filter((e) => isActive(e.student_id));
const CATEGORIES = ["Отличник", "Хорошист", "Есть тройки", "Только зачёты", "Есть задолженности", "Кандидат на отчисление", "Ещё не сдавал сессию",
  "Академический отпуск", "Отчислен", "Выпускник"];
const CATEGORY_KIND = { "Отличник": "ok", "Хорошист": "ok", "Есть задолженности": "warn", "Кандидат на отчисление": "bad",
  "Академический отпуск": "muted", "Отчислен": "muted", "Выпускник": "muted", "Ещё не сдавал сессию": "info" };

/* ── Группы (v_groups) ── */
const avg = (rows) => { const p = rows.filter((r) => r.points != null); return p.length ? +(p.reduce((s, r) => s + r.points, 0) / p.length).toFixed(1) : null; };
const groupRow = (g) => {
  const st = students.filter((s) => s.group_name === g.name);
  const active = st.filter((s) => s.status === ACTIVE);
  return { group_name: g.name, specialty: g.spec, profile: g.profile, study_form: g.form, admission_year: g.year, course: course(g.year),
    current_semester: course(g.year) * 2 - 1, curator: g.curator, headman: st.find((s) => s.is_headman)?.student ?? null,
    active_students: active.length, budget_students: active.filter((s) => s.funding === "Бюджет").length };
};

  curDisc(g).forEach((discipline, di) => {
    const teacher = pick(teachers).full_name;
    const kinds = discipline === "Иностранный язык" ? [["Практика", "every"]]
      : [["Лекция", "every"], [di % 2 ? "Лабораторная" : "Практика", di === 0 ? "every" : pick(["odd", "even"])]];
    kinds.forEach(([lesson_type, parity]) => {
      slots.push({ slot_id: slots.length + 1, group_name: g.name, discipline, lesson_type, teacher, parity, weekday: int(1, 5), pair_number: int(1, 4),

/* ── Таблица с постраничным выводом ── */
const PAGE_SIZE = 20;
const pageNo = {};
const tables = {};
function tableCard(id, title, cols, rows, key) {
  tables[id] = { rows, key };
  const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  const p = Math.min(pageNo[id] || 1, pages);
  const shown = rows.slice((p - 1) * PAGE_SIZE, p * PAGE_SIZE);
  const headRow = cols.map(([l, , c]) => `<th class="${c || ""}">${l}</th>`).join("");
  const body = shown.length
    ? shown.map((r, i) => `<tr data-k="${esc(key(r))}" style="--r:${Math.min(i, 14)}">${cols.map(([, f, c]) => `<td class="${c || ""}">${f(r)}</td>`).join("")}</tr>`).join("")
    : `<tr data-k="empty"><td colspan="${cols.length}" class="empty">${icon("search")}<b>Ничего не найдено</b>Измените фильтры или спросите агента</td></tr>`;
  const a = rows.length ? (p - 1) * PAGE_SIZE + 1 : 0, b = Math.min(p * PAGE_SIZE, rows.length);
  const pager = pages > 1 ? `<div class="pager"><span>${a}–${b} из ${rows.length}</span><div class="pages">
      <button data-tbl="${id}" data-pg="${p - 1}" ${p <= 1 ? "disabled" : ""} aria-label="Предыдущая страница">${icon("left")}</button>
      ${pageButtons(p, pages).map((n) => n === "…" ? `<span class="gap">…</span>` : `<button data-tbl="${id}" data-pg="${n}" class="${n === p ? "cur" : ""}">${n}</button>`).join("")}
      <button data-tbl="${id}" data-pg="${p + 1}" ${p >= pages ? "disabled" : ""} aria-label="Следующая страница">${icon("right")}</button></div></div>` : "";
  return `<section class="card table-card"><div class="table-head"><h2>${title}</h2><span class="count">Всего записей: <b>${rows.length}</b></span></div>
    <div class="table-wrap"><table><thead><tr>${headRow}</tr></thead><tbody>${body}</tbody></table></div>${pager}</section>`;
}
function pageButtons(cur, total) {
  if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
  const set = [...new Set([1, cur - 1, cur, cur + 1, total])].filter((n) => n >= 1 && n <= total).sort((a, b) => a - b);
  return set.flatMap((n, i) => (i && n - set[i - 1] > 1 ? ["…", n] : [n]));
}

/* ── OLAP: анализ успеваемости ── */
const OPS = [["rollup-group", "Roll-up по группе"], ["rollup-discipline", "Roll-up по дисциплине"], ["rollup-semester", "Roll-up по семестру"],
  ["slice-group", "Срез по группе"], ["slice-discipline", "Срез по дисциплине"], ["dice", "Dice"],
  ["drilldown-group", "Drill-down по группе"], ["cross-group-semester", "Кросс-таблица Группа × Семестр"]];
function rollup(key, rows = results) {
  const m = new Map();
  rows.forEach((r) => { const k = key(r); if (!m.has(k)) m.set(k, []); m.get(k).push(r); });
  return [...m.entries()].map(([name, rs]) => ({ name, avg: avg(rs), debts: rs.filter((r) => r.points == null).length,
    students: new Set(rs.map((r) => r.student)).size, results: rs.length, excellent: rs.filter((r) => mark(r.points) === 5).length }));
}
const ROLLUP_COLS = (first) => [[first, (r) => esc(r.name)], ["Средний балл", (r) => r.avg ?? "—", "num"],
  ["Результатов", (r) => r.results, "num"], ["На «отлично»", (r) => r.excellent, "num"], ["Долгов", (r) => r.debts, "num"]];
const RESULT_COLS = [["Студент", (r) => personCell(r.student)], ["Группа", (r) => r.group_name], ["Дисциплина", (r) => esc(r.discipline)],
  ["Семестр", (r) => r.semester, "num"], ["Контроль", (r) => r.control_type], ["Баллы", (r) => r.points ?? "—", "num"],
  ["Оценка", (r) => r.points == null ? badge("долг", "bad") : isGraded(r.control_type) ? mark(r.points) : "зачтено"]];
const DISC_NAMES = [...new Set(results.map((r) => r.discipline))];
const SEMS = [...new Set(results.map((r) => r.semester))].sort((a, b) => a - b);

const bars = (rows) => {
  const best = Math.max(...rows.map((r) => r.avg ?? 0));
  return `<div class="hbars">${rows.map((r, i) => `<div class="hb ${r.avg === best ? "best" : ""}" style="--i:${i}"><span class="hb-l" title="${esc(r.name)}">${esc(r.name)}</span>
    <span class="hb-t"><i style="--v:${(r.avg ?? 0) / 54}"></i></span><b>${r.avg ?? "—"}</b></div>`).join("")}</div>`;
};
const topRounded = (x, y, w, h, r) => { r = Math.max(0, Math.min(r, w / 2, h)); return `M${x},${y + h}V${y + r}A${r},${r} 0 0 1 ${x + r},${y}H${x + w - r}A${r},${r} 0 0 1 ${x + w},${y + r}V${y + h}Z`; };
function chart(rows, label) {
  const legend = `<span class="legend"><i></i>лучший результат</span>`;
  if (rows.length > 6) return `<section class="card chart-card"><div class="table-head"><h2>${label}</h2>${legend}</div>${bars(rows)}</section>`;
  const W = 1000, H = 300, L = 36, B = 46, T = 30, R = 8, top = 54;
  const y = (v) => T + (H - T - B) * (1 - v / top);
  const gw = (W - L - R) / rows.length, bw = Math.min(gw * 0.56, 84);
  const best = Math.max(...rows.map((r) => r.avg ?? 0));
  let s = `<defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6491f0"/><stop offset="1" stop-color="#052891"/></linearGradient>
    <linearGradient id="gB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e16aff"/><stop offset="1" stop-color="#820aaa"/></linearGradient></defs>`;
  [0, 10, 20, 30, 40, 50].forEach((v) => { s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 10}" y="${y(v) + 4}" text-anchor="end">${v}</text>`; });
  rows.forEach((r, i) => {
    const v = r.avg ?? 0, cx = L + gw * i + gw / 2, x = cx - bw / 2;
    s += `<g class="bar-g" style="--i:${i}"><path class="bar" d="${topRounded(x, y(v), bw, y(0) - y(v), 14)}" fill="url(#${v === best ? "gB" : "gA"})"><title>${esc(r.name)}: ${v}</title></path>
      <text class="bar-v" x="${cx}" y="${y(v) - 10}" text-anchor="middle">${v}</text><text x="${cx}" y="${H - 16}" text-anchor="middle">${esc(trim(String(r.name), 22))}</text></g>`;
  });
  return `<section class="card chart-card"><div class="table-head"><h2>${label}</h2>${legend}</div><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${s}</svg></div></section>`;
}

/* ═════════ РЕНДЕР: точечное обновление DOM, чтобы переходы CSS отыгрывали плавно ═════════ */
function morph(a, b) {
  for (const { name } of [...a.attributes]) if (!b.hasAttribute(name)) a.removeAttribute(name);
  for (const { name, value } of [...b.attributes]) if (a.getAttribute(name) !== value) a.setAttribute(name, value);
  if (a.tagName === "INPUT") { if (a !== document.activeElement) a.value = b.getAttribute("value") ?? ""; return; }
  const v = a.tagName === "SELECT" ? b.value : null;
  morphChildren(a, b);
  if (v != null) a.value = v;
}
function morphChildren(a, b) {
  const x = [...a.childNodes], y = [...b.childNodes];
  y.forEach((n, i) => {
    const o = x[i];
    if (!o) a.append(n);
    else if (o.nodeType !== n.nodeType || o.nodeName !== n.nodeName || (o.nodeType === 1 && o.dataset.k !== n.dataset.k)) a.replaceChild(n, o);
    else if (o.nodeType === 1) morph(o, n);
    else if (o.nodeValue !== n.nodeValue) o.nodeValue = n.nodeValue;
  });
  x.slice(y.length).forEach((n) => n.remove());
}

/* ── Нижние вкладки ── */
const tabsEl = $("#tabs");
tabsEl.style.setProperty("--n", TABS.length);
tabsEl.insertAdjacentHTML("beforeend", TABS.map((t, i) =>
  `<button class="tab" role="tab" data-tab="${t.id}" aria-selected="${i === 0}" title="${t.title}">${icon(t.icon)}<span>${t.short || t.title}</span></button>`).join(""));
function markTab(i) {
  tabsEl.style.setProperty("--i", i);
  $$(".tab").forEach((b, j) => b.setAttribute("aria-selected", i === j));
  const t = $$(".tab")[i];
  const bar = $(".tabbar");
  if (t && bar.scrollWidth > bar.clientWidth) bar.scrollTo({ left: t.offsetLeft - bar.clientWidth / 2 + t.offsetWidth / 2, behavior: REDUCED ? "auto" : "smooth" });
}
let tabToken = 0;
async function showTab(tab) {
  const token = ++tabToken;
  const prev = currentTab, idx = TABS.findIndex((t) => t.id === tab), pidx = TABS.findIndex((t) => t.id === prev);
  currentTab = tab;
  markTab(idx);
  $("#ctx").textContent = `Видит вкладку «${TAB[tab].title}»`;
  if (tab !== prev) {
    const dir = Math.sign(idx - pidx);
    enterDx = dir * 28;
    const old = $("#page .view");
    if (old && !REDUCED) {
      await old.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: `translateX(${-dir * 20}px)` }],
        { duration: 160, easing: "cubic-bezier(.55, 0, .75, .2)", fill: "forwards" }).finished.catch(() => {});
    }
    if (token !== tabToken) return;
    $("#content").scrollTop = 0;
  }
  render();
}
tabsEl.addEventListener("click", (e) => { const t = e.target.closest(".tab"); if (t) showTab(t.dataset.tab); });

/* ── Фильтры, переключатели и страницы таблиц ── */
function setState(path, val) {
  const [tab, key] = path.split(".");
  state[tab][key] = val;
  for (const k in pageNo) delete pageNo[k];
  render();
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-set],[data-pg],[data-go]");
  if (!t || t.disabled) return;
  if (t.dataset.set) setState(t.dataset.set, t.dataset.val);
  else if (t.dataset.pg) {
    pageNo[t.dataset.tbl] = +t.dataset.pg;
    render();
    const card = t.closest(".table-card");
    if (card && card.getBoundingClientRect().top < $("#content").getBoundingClientRect().top) card.scrollIntoView({ block: "start", behavior: REDUCED ? "auto" : "smooth" });
  } else if (t.dataset.go) {
    const [tab, ...kv] = t.dataset.go.split("|");
    go(tab, Object.fromEntries(kv.map((p) => p.split("="))));
  }
});
$("#page").addEventListener("input", (e) => { if (e.target.matches("input[data-bind]")) setState(e.target.dataset.bind, e.target.value); });
$("#page").addEventListener("change", (e) => { if (e.target.matches("select[data-bind]")) setState(e.target.dataset.bind, e.target.value); });

// Переход к вкладке (из чата или карточки): фильтры → вкладка → подсветка нужной строки
async function go(tab, patch, focus) {
  if (patch) Object.assign(state[tab], patch);
  for (const k in pageNo) delete pageNo[k];
  setOpen(false);
  await showTab(tab);
  if (focus) { await wait(420); focusRow(...focus); }
}
function focusRow(id, key) {
  const t = tables[id];
  if (!t) return;
  const i = t.rows.findIndex((r) => String(t.key(r)) === String(key));

}

/* ═════════ ЧАТ ═════════ */
const chat = $("#chat"), slot = $("#chatSlot"), box = $("#messages"), thread = $("#thread"), input = $("#input");
let isOpen = false, chatAnim;
new ResizeObserver(() => { if (!chat.classList.contains("open")) slot.style.height = chat.offsetHeight + "px"; }).observe(chat);

// Раскрытие и сворачивание — плавно меняем ширину и высоту (FLIP), страница под чатом уходит в размытие
function setOpen(open) {
  if (isOpen === open) return;
  isOpen = open;
  const first = chat.getBoundingClientRect();
  chatAnim?.cancel();
  chat.classList.remove("closing");
  chat.classList.toggle("open", open);
  const last = chat.getBoundingClientRect();
  if (!open) {
    chat.classList.add("open", "closing");
    const h = slot.offsetHeight;
    slot.style.height = last.height + "px";
    if (!REDUCED) slot.animate([{ height: h + "px" }, { height: last.height + "px" }], { duration: 380, easing: EASE });
  }
  $("#scrim").classList.toggle("show", open);
  document.body.classList.toggle("chat-open", open);
  const t = $("#toggle");
  t.setAttribute("aria-expanded", open);
  t.title = t.ariaLabel = open ? "Свернуть чат" : "Развернуть чат";
  chatAnim = chat.animate([{ width: first.width + "px", height: first.height + "px" }, { width: last.width + "px", height: last.height + "px" }],
    { duration: REDUCED ? 0 : open ? 560 : 380, easing: open ? EASE : "cubic-bezier(.4, 0, .2, 1)" });
  chatAnim.onfinish = () => { if (!open) chat.classList.remove("open", "closing"); };
  if (open) box.scrollTop = box.scrollHeight;
}
$("#toggle").addEventListener("click", () => setOpen(!isOpen));
$("#scrim").addEventListener("click", () => setOpen(false));
$("#peek").addEventListener("click", () => setOpen(true));

// Плавно подстраивает высоту свёрнутого чата, когда в нём что-то появляется
function smoothHeight(fn) {
  if (isOpen || REDUCED) return fn();
  const h = chat.offsetHeight;
  fn();
  const h2 = chat.offsetHeight;
  if (h !== h2) chat.animate([{ height: h + "px" }, { height: h2 + "px" }], { duration: 380, easing: EASE });
}

function setPeek(who, text) {

}

const scrollDown = () => requestAnimationFrame(() => box.scrollTo({ top: box.scrollHeight, behavior: REDUCED ? "auto" : "smooth" }));

// Текст агента появляется по словам
function streamify(el) {
  if (!el) return 0;
  let n = 0;
  const walk = (node) => [...node.childNodes].forEach((c) => {
    if (c.nodeType === 3) {
      const frag = document.createDocumentFragment();
      c.nodeValue.split(/(\s+)/).forEach((part) => {
        if (!part) return;
        if (/^\s+$/.test(part)) frag.append(part);
        else { const s = document.createElement("span"); s.className = "w"; s.style.setProperty("--w", n++); s.textContent = part; frag.append(s); }
      });
      c.replaceWith(frag);
    } else if (c.nodeType === 1) walk(c);
  });
  walk(el);
  return n;
}
function agentSay({ text = "", html = "", actions = [] }) {
  hideHello();
  const el = document.createElement("div");
  el.className = "msg agent";
  el.innerHTML = `<span class="orb"></span><div class="body">${text ? `<p class="stream">${text}</p>` : ""}${html ? `<div class="block">${html}</div>` : ""}</div>`;
  const words = streamify(el.querySelector(".stream"));
  const per = Math.min(26, 640 / Math.max(words, 1));
  el.style.setProperty("--wd", per + "ms");
  el.style.setProperty("--after", Math.round(words * per + 120) + "ms");
  if (actions.length) {
    const row = document.createElement("div");
    row.className = "acts";
    actions.forEach(([label, run, primary]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = `btn sm go ${primary ? "primary" : "soft"}`;
      b.innerHTML = `<span>${esc(label)}</span>${icon("arrow")}`;
      b.addEventListener("click", run);
      row.append(b);
    });
    el.querySelector(".body").append(row);
  }
  thread.append(el);
  scrollDown();
  setPeek("agent", el.querySelector(".body p")?.textContent || "Ответ агента");
}
function addUser(text, items) {

  thread.append(el);

}
function addTyping() {

async function send() {
  const text = input.value.trim();
  if (!text && !pending.length) return;
  const files = pending;
  addUser(text, files);
  pending = []; renderAttached();
  input.value = ""; autoGrow(); updateSend();
  setOpen(true);
  const typing = addTyping();
  chat.classList.add("busy");
  await wait(650 + Math.random() * 450);
  typing.remove();
  chat.classList.remove("busy");
  const res = text ? reply(text)
    : { text: `Получил ${files.length} ${plural(files.length, "файл", "файла", "файлов")}. В макете разбор документов не подключён — напишите, что с ними сделать.` };
  if (res.change) return runChange(res.change);

}

/* ═════════ ОТВЕТЫ АГЕНТА (заглушка: разбор по ключевым словам на выдуманных данных) ═════════ */
const CHANGE_WORDS = /(измени|исправ|добав|удали|постав|обнови|внеси|запиши|перевед|замени|смени|отметь)/;
const groupIn = (raw) => { const m = raw.match(/[иi][дd][бb]\s*-?\s*(\d{2})\s*-?\s*(\d{2})/i); return m ? `ИДБ-${m[1]}-${m[2]}` : null; };
const stemOf = (last) => last.slice(0, last.endsWith("а") ? -2 : -1);

// Ищет людей по ФИО целиком или по основе фамилии (Орлов → Орлова, Орлову…), уточняет по имени
function findPeople(list, nameOf, raw) {
  const t = " " + norm(raw).replace(/[^а-я0-9]+/g, " ") + " ";
  const full = list.filter((p) => t.includes(" " + norm(nameOf(p)) + " "));
  if (full.length) return full;
  const hits = list.filter((p) => { const st = stemOf(norm(nameOf(p).split(" ")[0])); return st.length >= 3 && t.includes(" " + st); });
  const byFirst = hits.filter((p) => t.includes(" " + norm(nameOf(p).split(" ")[1]).slice(0, -1)));
  return byFirst.length ? byFirst : hits;
}
function dateIn(t) {
  if (/послезавтра/.test(t)) return addDays(TODAY, 2);
  if (/завтра/.test(t)) return addDays(TODAY, 1);
  if (/вчера/.test(t)) return addDays(TODAY, -1);
  if (/сегодня/.test(t)) return TODAY;
  const days = [/воскресен/, /понедельник/, /вторник/, /(^|[^а-я])сред[ауы]([^а-я]|$)/, /четверг/, /пятниц/, /суббот/];
  const i = days.findIndex((re) => re.test(t));
  return i < 0 ? null : addDays(TODAY, (i - D(TODAY).getUTCDay() + 7) % 7);
}
function mini(cols, rows, limit = 5) {
  const shown = rows.slice(0, limit);
  return `<div class="mini"><table><thead><tr>${cols.map(([l, , c]) => `<th class="${c || ""}">${l}</th>`).join("")}</tr></thead>
    <tbody>${shown.map((r, i) => `<tr style="--r:${i}">${cols.map(([, f, c]) => `<td class="${c || ""}">${f(r)}</td>`).join("")}</tr>`).join("")}</tbody></table>
    ${rows.length > limit ? `<div class="more">и ещё ${rows.length - limit}</div>` : ""}</div>`;
}

function reply(raw) {
  const t = norm(raw);
  const g = groupIn(raw);
  if (g && !GROUP_NAMES.includes(g)) return { text: `Группы <b>${esc(g)}</b> в базе нет. Есть: ${GROUP_NAMES.join(", ")}.` };
  if (CHANGE_WORDS.test(t)) return proposeChange(raw, t, g);
  if (/телефон|контакт|почт|email|e-mail|связат/.test(t)) return contactsReply(raw);
  if (/отчисл/.test(t)) return expulsionReply();
  if (/просроч/.test(t)) return overdueReply();
  const st = findPeople(students, (s) => s.student, raw);
  if (st.length) return studentReply(st);
  const nav = navReply(t, g);
  if (nav) return nav;
  if (/стипенд/.test(t)) return scholarshipReply(t);
  if (/расписан|занят|(^|[^а-я])пар(а|ы|у|ой)?([^а-я]|$)/.test(t)) return scheduleReply(t, g);
  if (/практик/.test(t)) return practiceReply(g);
  if (/средн|балл|сложн|успеваем|рейтинг|olap|олап/.test(t)) return olapReply(t);
  if (/долг|задолж|должник/.test(t)) return debtsReply(g);
  if (g) return groupReply(g);
  return { text: "Пока я работаю в демо-режиме: могу найти студента, группу, пары, долги, практики и контакты сотрудников, а также изменить группу или статус студента и статус заявки на справку." };
}

function proposeChange(raw, t, g) {
  const rq = t.match(/заявк\D{0,8}(\d{2,4})/);
  if (rq) {
    const r = requests.find((x) => x.request_id === +rq[1]);
    if (!r) return { text: `Заявку <b>№${esc(rq[1])}</b> не нашёл. Есть номера с ${Math.min(...requests.map((x) => x.request_id))} по ${Math.max(...requests.map((x) => x.request_id))}.` };
    const sub = `${r.document} · ${shortName(r.student)}, ${r.group_name}`;
    if (/удали/.test(t)) {
      return { change: { danger: true, title: `Заявка №${r.request_id}`, sub, fields: [["Заявка", r.status, "Удалена"]], tab: "requests", reveal: { status: "", q: "" },
        done: `Заявка №${r.request_id} удалена.`, apply: () => requests.splice(requests.indexOf(r), 1) } };
    }
    const to = /готов|выда/.test(t) ? "Готова к выдаче" : /работ/.test(t) ? "В работе" : /нов/.test(t) ? "Новая" : null;
    if (!to) return { text: `Какой статус поставить заявке <b>№${r.request_id}</b>? Сейчас — «${esc(r.status)}». Можно: ${["Новая", "В работе", "Готова к выдаче"].filter((x) => x !== r.status).map((x) => `«${x}»`).join(" или ")}.` };
    if (r.status === to) return { text: `Заявка <b>№${r.request_id}</b> уже в статусе «${esc(to)}» — менять нечего.` };
    const fields = [["Статус", r.status, to]];
    if (!r.processed_by) fields.push(["Исполнитель", "—", ME.full_name]);
    return { change: { title: `Заявка №${r.request_id}`, sub, fields, tab: "requests", reveal: { status: "", q: "" }, focus: ["requests", r.request_id],
      done: `Готово: заявка №${r.request_id} теперь «${to}».`, apply: () => { r.status = to; r.processed_by ||= ME.full_name; } } };
  }
  const st = findPeople(students, (s) => s.student, raw);
  if (st.length) {
    let f = null;
    if (g) f = ["Группа", "group_name", g];
    else if (/восстанов|вернут|из академ/.test(t)) f = ["Статус", "status", "Обучается"];
    else if (/академ/.test(t)) f = ["Статус", "status", "Академический отпуск"];
    else if (/бюджет/.test(t)) f = ["Основа обучения", "funding", "Бюджет"];
    else if (/договор|платн|контракт/.test(t)) f = ["Основа обучения", "funding", "Договор"];
    if (!f) return { text: `Что изменить у ${st.length === 1 ? `<b>${esc(st[0].student)}</b>` : "студента"}? Могу перевести в другую группу, оформить академический отпуск или сменить основу обучения.` };
    if (st.length > 1) return { text: `Нашёл ${st.length} ${plural(st.length, "студента", "студентов", "студентов")} с такой фамилией — кого именно?`,
      actions: st.slice(0, 6).map((s) => [`${s.student} · ${s.group_name}`, () => runChange(studentChange(s, ...f))]) };
    if (st[0][f[1]] === f[2]) return { text: `У <b>${esc(st[0].student)}</b> уже «${esc(f[2])}».` };
    return { change: studentChange(st[0], ...f) };
  }
  return { text: "Уточните, что и где изменить: назовите студента или номер заявки на справку." };
}
function studentChange(s, label, key, to) {

}

  return { text: `Нашёл ${st.length} ${plural(st.length, "студента", "студентов", "студентов")}:`,

    actions: [["Показать всех в таблице", () => go("students", { q: stemOf(st[0].student.split(" ")[0]), cat: "", group: "" }), true]] };
}
const TAB_WORDS = [["schedule", /расписан/], ["debtors", /должник|задолж|долг/], ["requests", /справк|заявк/], ["practice", /практик/],
  ["employees", /сотрудник|преподавател|кадр/], ["olap", /olap|олап|аналит|анализ/], ["students", /студент/], ["groups", /групп/]];
function navReply(t, g) {
  if (!/(^|[^а-я])(открой|открыть|покажи|показать|перейди|перейти|вкладк)/.test(t)) return null;

  const where = [patch.group ? `группа ${g}` : "", patch.date ? human(patch.date) : ""].filter(Boolean).join(", ");
  return { text: `Открываю «${TAB[tab].title}»${where ? ` — ${where}` : ""}.`, go: [tab, patch] };
}
function scholarshipReply(t) {

  return { text: `${note}${hi ? "Повышенную стипендию" : "Стипендию"} получают <b>${rows.length}</b> ${plural(rows.length, "студент", "студента", "студентов")}:`,
    html: mini([["Студент", (r) => personCell(r.student)], ["Группа", (r) => r.group_name], ["Стипендия", (r) => esc(r.scholarships), "wrap-sm"]], rows),
    actions: [["Показать в «Студентах»", () => go("students", { cat: hi ? "Отличник" : top.length ? "" : "Хорошист", q: "", group: "" }), true]] };
}
function scheduleReply(t, g) {
  const d = dateIn(t) || TODAY;

  const rel = d === TODAY ? "сегодня, " : d === addDays(TODAY, 1) ? "завтра, " : "";

    html: `<div class="mini-list">${ls.slice(0, 6).map((l, i) => `<div class="ml-row" style="--i:${i}"><span class="ml-time">${PAIRS[l.pair_number][0]}<small>${l.pair_number} пара</small></span>
      <span class="ml-main"><b>${esc(l.discipline)}</b><small>${l.lesson_type} · ${l.classroom} · ${esc(shortName(l.teacher))}${g ? "" : ` · ${l.group_name}`}</small></span></div>`).join("")}</div>`,

}
function practiceReply(g) {
  const rows = practices.filter((p) => !g || p.group_name === g);
  if (!rows.length) return { text: g ? `У <b>${g}</b> практик в этом году не было.` : "Практик не найдено." };

    actions: [["Открыть «Практики»", () => go("practice", { group: g || "", q: "", kind: "" }), true]] };
}
function olapReply(t) {
  if (/сложн|трудн|хуж|низк/.test(t)) {
    const rows = rollup((r) => r.discipline).filter((r) => r.avg != null).sort((a, b) => a.avg - b.avg);
    return { text: `Сложнее всего даётся <b>${esc(rows[0].name)}</b>: средний балл ${rows[0].avg}, долгов — ${rows[0].debts}.`, html: bars(rows.slice(0, 5)),
      actions: [["Открыть OLAP по дисциплинам", () => go("olap", { op: "rollup-discipline" }), true]] };
  }
  const rows = rollup((r) => r.group_name).sort((a, b) => b.avg - a.avg);
  return { text: `Лучший средний балл у <b>${rows[0].name}</b> — ${rows[0].avg}, ниже всех у <b>${rows.at(-1).name}</b> — ${rows.at(-1).avg}.`, html: bars(rows),
    actions: [["Открыть OLAP-анализ", () => go("olap", { op: "rollup-group" }), true]] };
}
function debtsReply(g) {
  const rows = debtorsNow().filter((d) => !g || d.group_name === g);
  if (!rows.length) return { text: `${g ? `У <b>${g}</b>` : "У студентов"} задолженностей нет.` };
  const people = new Set(rows.map((r) => r.student)).size;
  return { text: `${g ? `<b>${g}</b>: ` : ""}${rows.length} ${plural(rows.length, "задолженность", "задолженности", "задолженностей")} у ${people} ${plural(people, "студента", "студентов", "студентов")}:`,
    html: mini([["Студент", (r) => esc(r.student)], ["Группа", (r) => r.group_name], ["Дисциплина", (r) => esc(r.discipline)], ["Попыток", (r) => r.attempts, "num"]], rows),
    actions: [["Открыть «Должники»", () => go("debtors", { group: g || "", q: "" }), true]] };
}
function groupReply(g) {
  const r = groupRow(GROUPS.find((x) => x.name === g));
  r.debts = debtorsNow().filter((d) => d.group_name === g).length;
  r.avg = avg(results.filter((x) => x.group_name === g));

      <div><small>Куратор</small><b>${r.curator ? esc(shortName(r.curator)) : "—"}</b></div><div><small>Староста</small><b>${r.headman ? esc(shortName(r.headman)) : "—"}</b></div>
      <div><small>Студентов · бюджет</small><b>${r.active_students} · ${r.budget_students}</b></div><div><small>Средний балл · долгов</small><b>${r.avg ?? "—"} · ${r.debts}</b></div></div></div>`,
    actions: [["Студенты группы", () => go("students", { group: g, q: "", cat: "" }), true], ["Расписание", () => go("schedule", { group: g, view: "day" })]] };
}

/* ═════════ ВЛОЖЕНИЯ ═════════ */
const kindOf = (f) => { const ext = f.name.split(".").pop().toLowerCase(); return ["jpg", "jpeg", "png"].includes(ext) ? "image" : ext; };
async function pdfDoc(file) { return pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise; }
async function renderPdfPage(pdf, n, width) {
  const page = await pdf.getPage(n);
  const vp = page.getViewport({ scale: 1 });
  const v = page.getViewport({ scale: width / vp.width });
  const c = document.createElement("canvas");
  c.width = v.width; c.height = v.height;
  await page.render({ canvasContext: c.getContext("2d"), viewport: v }).promise;
  return c;
}
async function textOf(item) {
  if (item.kind === "txt") return item.file.text();
  if (item.kind === "docx") return (await mammoth.extractRawText({ arrayBuffer: await item.file.arrayBuffer() })).value;
  return "";
}
// Готовит превью один раз и сохраняет его в item.preview (data URL или текст)
async function makePreview(item) {
  try {
    if (item.kind === "image") item.preview = { img: item.url };
    else if (item.kind === "pdf") item.preview = { img: (await renderPdfPage(await pdfDoc(item.file), 1, 200)).toDataURL() };
    else item.preview = { text: (await textOf(item)).slice(0, 600) };
  } catch (e) { item.preview = { ext: item.kind }; }
}
function thumbEl(item, removable) {
  const b = document.createElement("div");
  b.className = "thumb";
  const p = item.preview;
  const inner = !p ? "" : p.img ? `<img src="${p.img}" alt="">` : p.text != null ? `<div class="page">${esc(p.text)}</div>` : `<div class="ext">${esc(p.ext)}</div>`;
  b.innerHTML = `<button type="button" class="pic ${p ? "" : "loading"}" title="Открыть ${esc(item.file.name)}">${inner}</button><span class="name">${esc(item.file.name)}</span>`;
  b.querySelector(".pic").addEventListener("click", () => openViewer(item));
  if (removable) {
    const x = document.createElement("button");
    x.type = "button"; x.className = "remove"; x.innerHTML = icon("x"); x.ariaLabel = "Убрать файл";
    x.addEventListener("click", () => { pending = pending.filter((i) => i !== item); renderAttached(); updateSend(); });
    b.append(x);
  }
  return b;
}
let pending = [];
const fileInput = $("#fileInput");
$("#attachBtn").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", async () => {
  const allowed = /\.(pdf|docx|txt|jpe?g|png)$/i;
  const items = [...fileInput.files].filter((f) => allowed.test(f.name)).map((f) => ({ file: f, kind: kindOf(f), url: URL.createObjectURL(f) }));
  fileInput.value = "";
  pending.push(...items);
  renderAttached(); updateSend();
  await Promise.all(items.map(makePreview));
  renderAttached();
  input.focus();
});
function renderAttached() {
  smoothHeight(() => {
    const a = $("#attached");
    a.replaceChildren(...pending.map((i) => thumbEl(i, true)));
    a.hidden = pending.length === 0;
  });
}
async function openViewer(item) {
  $("#viewerName").textContent = item.file.name;
  const body = $("#viewerBody");
  body.replaceChildren();
  showModal($("#viewer"));
  try {
    if (item.kind === "image") { const img = new Image(); img.src = item.url; img.alt = item.file.name; body.append(img); }
    else if (item.kind === "pdf") { const pdf = await pdfDoc(item.file); for (let n = 1; n <= pdf.numPages; n++) body.append(await renderPdfPage(pdf, n, 800)); }
    else if (item.kind === "docx") {
      const d = document.createElement("div"); d.className = "doc html";
      d.innerHTML = (await mammoth.convertToHtml({ arrayBuffer: await item.file.arrayBuffer() })).value;
      body.append(d);
    } else { const d = document.createElement("div"); d.className = "doc"; d.textContent = await item.file.text(); body.append(d); }
  } catch (e) { const d = document.createElement("div"); d.className = "doc"; d.textContent = "Не удалось открыть файл."; body.append(d); }
}
$("#viewerClose").addEventListener("click", () => hideModal($("#viewer")));
$("#viewer").addEventListener("click", (e) => { if (e.target.id === "viewer") hideModal($("#viewer")); });

/* ── Клавиатура: ⌘K / Ctrl+K — к чату, Esc — закрыть верхний слой ── */
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.code === "KeyK") { e.preventDefault(); input.focus(); }
  else if (e.key === "Escape") {
    if (!$("#confirm").hidden) closeConfirm(false);
    else if (!$("#viewer").hidden) hideModal($("#viewer"));
    else if (isOpen) setOpen(false);
  }
});

$("#meAvatar").className = `avatar t${tone(ME.full_name)}`;
